<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>متجري</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,Tahoma,sans-serif;
}

body{
    background:linear-gradient(135deg,#061b4f,#0879d1,#00a8e8);
    min-height:100vh;
    color:#111;
}

header{
    text-align:center;
    color:white;
    padding:30px 15px;
}

header h1{
    font-size:32px;
}

header p{
    margin-top:8px;
}

.product{
    width:92%;
    max-width:420px;
    margin:20px auto 50px;
    background:white;
    border-radius:22px;
    overflow:hidden;
    box-shadow:0 15px 40px rgba(0,0,0,.25);
}

.main-image{
    width:100%;
    height:330px;
    object-fit:contain;
    background:#f8fafc;
}

.thumbnails{
    display:flex;
    gap:8px;
    padding:10px;
    overflow-x:auto;
}

.thumbnails img{
    width:60px;
    height:60px;
    object-fit:cover;
    border-radius:8px;
    cursor:pointer;
    border:2px solid transparent;
}

.thumbnails img.active{
    border-color:#0879d1;
}

.info{
    padding:20px;
}

.info h2{
    font-size:22px;
    margin-bottom:10px;
}

.description{
    color:#666;
    line-height:1.7;
}

.price{
    color:#0879d1;
    font-size:28px;
    font-weight:bold;
    margin:15px 0;
}

.order{
    width:100%;
    border:0;
    padding:15px;
    border-radius:12px;
    background:#20c967;
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.7);
    align-items:center;
    justify-content:center;
    padding:15px;
}

.box{
    background:white;
    width:100%;
    max-width:430px;
    padding:25px;
    border-radius:20px;
}

.box h2{
    text-align:center;
    margin-bottom:15px;
}

.box input{
    width:100%;
    padding:14px;
    margin-bottom:12px;
    border:1px solid #ddd;
    border-radius:10px;
    font-size:16px;
}

.confirm{
    width:100%;
    padding:15px;
    border:0;
    border-radius:10px;
    background:#20c967;
    color:white;
    font-size:17px;
    font-weight:bold;
}

.close{
    display:block;
    text-align:center;
    margin-top:15px;
    color:#777;
    cursor:pointer;
}
</style>
</head>

<body>

<header>
    <h1>🛍️ متجري</h1>
    <p>منتجات مميزة بأسعار مناسبة</p>
</header>

<div class="product">

    <img id="mainImage"
         class="main-image"
         src="image-1.jpg">

    <div class="thumbnails">

        <img src="image-1.jpg"
             class="active"
             onclick="changeImage(this)">

        <img src="image-2.jpg"
             onclick="changeImage(this)">

        <img src="image-3.jpg"
             onclick="changeImage(this)">

        <img src="image-4.jpg"
             onclick="changeImage(this)">

        <img src="image-5.jpg"
             onclick="changeImage(this)">

    </div>

    <div class="info">

        <h2>AirPods Pro Sim Original</h2>

        <p class="description">
            سماعة أذن لاسلكية Bluetooth باللون الأسود،
            مناسبة للموسيقى والمكالمات والدراسة والعمل
            والرياضة والاستخدام اليومي.
        </p>

        <div class="price">
            650 جنيه
        </div>

        <button class="order"
                onclick="openForm()">
            🛒 اطلب الآن
        </button>

    </div>

</div>


<div class="modal" id="modal">

    <div class="box">

        <h2>🛒 بيانات الطلب</h2>

        <input id="name"
               type="text"
               placeholder="الاسم بالكامل">

        <input id="phone"
               type="tel"
               placeholder="رقم الموبايل">

        <input id="governorate"
               type="text"
               placeholder="المحافظة">

        <input id="address"
               type="text"
               placeholder="العنوان بالتفصيل">

        <input id="quantity"
               type="number"
               value="1"
               min="1"
               placeholder="الكمية">

        <button class="confirm"
                onclick="sendOrder()">
            تأكيد الطلب عبر واتساب 📲
        </button>

        <span class="close"
              onclick="closeForm()">
            إلغاء
        </span>

    </div>

</div>


<script>

function changeImage(image){

    document.getElementById("mainImage").src =
        image.src;

    document.querySelectorAll(".thumbnails img")
    .forEach(img => img.classList.remove("active"));

    image.classList.add("active");
}


function openForm(){

    document.getElementById("modal")
    .style.display="flex";

}


function closeForm(){

    document.getElementById("modal")
    .style.display="none";

}


function sendOrder(){

    let name =
        document.getElementById("name").value.trim();

    let phone =
        document.getElementById("phone").value.trim();

    let governorate =
        document.getElementById("governorate").value.trim();

    let address =
        document.getElementById("address").value.trim();

    let quantity =
        document.getElementById("quantity").value;


    if(!name || !phone || !governorate || !address){

        alert("من فضلك اكتب كل البيانات");

        return;
    }


    let price = 650;

    let total =
        price * Number(quantity);


    let message =

`🛒 طلب جديد من المتجر

📦 المنتج: AirPods Pro Sim Original

🔢 الكمية: ${quantity}

💰 سعر الوحدة: ${price} جنيه

💵 الإجمالي: ${total} جنيه

👤 الاسم: ${name}

📱 رقم الموبايل: ${phone}

📍 المحافظة: ${governorate}

🏠 العنوان:
${address}`;


    let whatsapp =
        "201105850117";


    let url =
        "https://wa.me/" +
        whatsapp +
        "?text=" +
        encodeURIComponent(message);


    window.location.href=url;

}

</script>

</body>
</html>
